name: Build and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            ./gradlew build --no-daemon -PreleaseVersion="${REF_NAME#v}"
          else
            ./gradlew build --no-daemon
          fi
      - name: Prepare downloadable artifacts
        run: |
          mkdir dist
          cp paper/build/libs/mini-map-server-*.jar dist/
          cp provider-api/build/libs/mini-map-provider-api-*.jar dist/
          cd dist
          sha256sum *.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mini-map-server
          path: dist/*
          if-no-files-found: error
  paper-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['1.21.4', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: echo "MINIMAP_JAVA21=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :paper:jar :paper:fixtureJar --no-daemon
      - name: Start isolated Paper server
        env:
          MC_VERSION: ${{ matrix.version }}
        run: |
          runtime_java="$JAVA_HOME/bin/java"
          if [ "$MC_VERSION" = "1.21.4" ]; then runtime_java="$MINIMAP_JAVA21"; fi
          python3 scripts/paper-smoke.py --version "$MC_VERSION" --java "$runtime_java" --directory "$RUNNER_TEMP/paper-smoke" --accept-eula --fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-smoke-${{ matrix.version }}
          path: ${{ runner.temp }}/paper-smoke/console.log
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, paper-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mini-map-server
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
