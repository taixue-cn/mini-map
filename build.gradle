allprojects {
    group = 'io.github.minimap'
    version = providers.gradleProperty('releaseVersion').getOrElse('0.1.0')
    repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
}
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
    tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    test { useJUnitPlatform() }
    publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = "mini-map-${project.name}" } } }
}
project(':core') { dependencies { api project(':protocol'); api project(':provider-api') } }
project(':provider-api') { base { archivesName = 'mini-map-provider-api' } }
project(':paper') {
    dependencies {
        implementation project(':core')
        compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
        testImplementation 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    }
    jar {
        dependsOn configurations.runtimeClasspath
        archiveBaseName = 'mini-map-server'
        from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    processResources { filesMatching('plugin.yml') { expand(version: project.version) } }
    sourceSets {
        fixture {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
    }
    tasks.register('fixtureJar', Jar) {
        dependsOn fixtureClasses
        archiveClassifier = 'fixture'
        from sourceSets.fixture.output
    }
}
